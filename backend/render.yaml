services:
  - type: web
    name: clauseguard-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: "http://localhost:3000"

